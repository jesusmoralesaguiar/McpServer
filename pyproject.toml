[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpserver"
version = "0.1.0"
description = "Agnostic MCP server for surgical code context, symbols, and repo navigation"
readme = "README.md"
authors = [
    { name = "Jesus Morales Aguiar" }
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
mcpserver = "mcp_server.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
